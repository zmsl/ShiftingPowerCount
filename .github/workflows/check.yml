# `make check` (luacheck, syntax, busted specs, cf_upload tests) on every push and pull request.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: .lua
          key: lua-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.sh') }}
      - run: make bootstrap
      - run: make check
